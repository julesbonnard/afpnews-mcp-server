name = "afpnews-mcp-server"
main = "src/http/worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret configuration. Replace MCP_SERVER_URL with your actual
# workers.dev subdomain (or custom domain) after your first `wrangler
# deploy` — it must be a valid URL, not a placeholder like this one.
[vars]
APICORE_BASE_URL = "https://api.afp.com"
MCP_SERVER_URL = "https://afpnews-mcp-server.example.workers.dev"

# Secrets (do NOT put real values here — use `wrangler secret put <NAME>`):
#   APICORE_API_KEY
#   JWT_SECRET
