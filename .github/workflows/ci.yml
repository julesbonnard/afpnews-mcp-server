name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      # Gate : erreurs de type sur le code source (src/, hors tests — cf.
      # typecheck:test dans package.json, pas encore gaté ici : des erreurs
      # de type préexistantes dans src/__tests__/ restent à corriger avant
      # de pouvoir l'ajouter sans casser la CI dès ce premier run).
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
